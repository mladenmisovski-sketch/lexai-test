<!DOCTYPE html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LexAI.mk Chat</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header>
      <h1>LexAI.mk Chat</h1>
      <p>Прашај го твојот правен асистент</p>
    </header>

    <main id="chat-container">
      <div class="message user">👤 Здраво LexAI!</div>
      <div class="message ai">🤖 Здраво! Како можам да ти помогнам денес?</div>
    </main>

    <footer>
      <input
        type="text"
        id="userInput"
        placeholder="Внеси прашање..."
      />
      <button id="sendBtn">Испрати</button>
    </footer>

    <script src="chat.js"></script>
  </body>
</html>
